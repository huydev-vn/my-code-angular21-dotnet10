<mat-sidenav-container class="h-full">
  <mat-sidenav
    class="w-64 border-r border-slate-200"
    [opened]="sidenavOpened()"
    [mode]="sidenavMode()"
    [fixedInViewport]="true"
  >
    <div class="px-4 py-5 text-lg font-medium">Workspace</div>
    <mat-nav-list>
      @for (item of visibleNav(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="bg-slate-100"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex min-h-full flex-col">
    <mat-toolbar class="sticky top-0 z-10 border-b border-slate-200 bg-white">
      <button matIconButton type="button" aria-label="Toggle navigation" (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="ml-2 grow text-base font-medium">{{ user()?.email }}</span>
      <button matButton type="button" (click)="logout()">Sign out</button>
    </mat-toolbar>

    <main class="flex-1 bg-slate-50 p-6">
      <div class="mx-auto max-w-6xl">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
