<app-page-header
  title="Groups"
  subtitle="Business groups that receive permissions and organization-unit scope."
/>

<app-request-state
  [loading]="loading()"
  [error]="error()"
  [empty]="groups().length === 0"
  emptyTitle="No groups"
  (retry)="retry()"
>
  <mat-list class="rounded-lg border border-slate-200 bg-white">
    @for (group of groups(); track group.id) {
      <mat-list-item>
        <span matListItemTitle>{{ group.name }}</span>
        @if (group.description) {
          <span matListItemLine>{{ group.description }}</span>
        }
      </mat-list-item>
    }
  </mat-list>

  <app-page-pager
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [disabled]="loading()"
    (pageChange)="onPageChange($event)"
  />
</app-request-state>
