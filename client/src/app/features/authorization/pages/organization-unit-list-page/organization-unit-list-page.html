<app-page-header
  title="Organization units"
  subtitle="Nested units used to scope group access. Parent relationships are mocked."
/>

<app-request-state
  [loading]="loading()"
  [error]="error()"
  [empty]="organizationUnits().length === 0"
  emptyTitle="No organization units"
  (retry)="retry()"
>
  <mat-list class="rounded-lg border border-slate-200 bg-white">
    @for (unit of organizationUnits(); track unit.id) {
      <mat-list-item>
        <span matListItemTitle>{{ unit.name }}</span>
        <span matListItemLine>{{ unit.parentId ? 'Child unit' : 'Root unit' }}</span>
      </mat-list-item>
    }
  </mat-list>
</app-request-state>
