<app-page-header
  title="Permissions"
  subtitle="Runtime permission catalog from the authorization API."
/>

<app-request-state
  [loading]="loading()"
  [error]="error()"
  [empty]="permissions().length === 0"
  emptyTitle="No permissions"
  (retry)="retry()"
>
  <mat-list class="rounded-lg border border-slate-200 bg-white">
    @for (permission of permissions(); track permission.id) {
      <mat-list-item>
        <span matListItemTitle>{{ permission.displayName }}</span>
        <span matListItemLine>{{ permission.name }}</span>
      </mat-list-item>
    }
  </mat-list>

  <app-page-pager
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [disabled]="loading()"
    (pageChange)="onPageChange($event)"
  />
</app-request-state>
