<app-page-header
  title="Workspace"
  subtitle="Secure administration console for users, permissions, and organization units."
/>

<div class="grid gap-4 md:grid-cols-3">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Signed in as</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="mt-2 text-sm text-slate-700">{{ user()?.email }}</p>
      <p class="mt-1 text-sm text-app-muted">{{ user()?.groups?.join(', ') }}</p>
    </mat-card-content>
  </mat-card>

  <a routerLink="/users" class="block no-underline">
    <mat-card class="h-full border border-transparent transition hover:border-brand-200">
      <mat-card-header>
        <mat-card-title class="text-brand-800">Users</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="mt-2 text-sm text-app-muted">Browse the user directory.</p>
      </mat-card-content>
    </mat-card>
  </a>

  <a routerLink="/authorization" class="block no-underline">
    <mat-card class="h-full border border-transparent transition hover:border-brand-200">
      <mat-card-header>
        <mat-card-title class="text-brand-800">Authorization</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="mt-2 text-sm text-app-muted">Inspect permissions, groups, and units.</p>
      </mat-card-content>
    </mat-card>
  </a>
</div>
