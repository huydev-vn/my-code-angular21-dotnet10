<app-page-header
  title="Workspace"
  subtitle="Feature-based Angular 21 base with NgRx, Material, and Tailwind."
/>

<div class="grid gap-4 md:grid-cols-3">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Signed in as</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="mt-2 text-sm text-slate-700">{{ user()?.email }}</p>
      <p class="mt-1 text-sm text-slate-500">{{ user()?.groups?.join(', ') }}</p>
    </mat-card-content>
  </mat-card>

  <a routerLink="/users" class="block no-underline">
    <mat-card class="h-full">
      <mat-card-header>
        <mat-card-title>Users</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="mt-2 text-sm text-slate-600">Browse the mocked user directory.</p>
      </mat-card-content>
    </mat-card>
  </a>

  <a routerLink="/authorization" class="block no-underline">
    <mat-card class="h-full">
      <mat-card-header>
        <mat-card-title>Authorization</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="mt-2 text-sm text-slate-600">Inspect permissions, groups, and units.</p>
      </mat-card-content>
    </mat-card>
  </a>
</div>
