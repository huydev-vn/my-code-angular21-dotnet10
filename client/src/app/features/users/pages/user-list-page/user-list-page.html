<app-page-header
  title="Users"
  subtitle="Directory of accounts in this workspace. Data is mocked until the API is wired."
/>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" class="mb-4" />
}

@if (error()) {
  <p class="mb-4 text-sm text-red-600">{{ error() }}</p>
}

@if (users().length === 0 && !loading()) {
  <app-empty-state title="No users yet" description="Users will appear here after they register." />
} @else {
  <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
    <table mat-table [dataSource]="users()">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="groups">
        <th mat-header-cell *matHeaderCellDef>Groups</th>
        <td mat-cell *matCellDef="let row">{{ row.groups.join(', ') }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
}
