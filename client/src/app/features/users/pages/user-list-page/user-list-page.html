<app-page-header
  title="Users"
  subtitle="Directory of accounts in this workspace."
/>

<app-request-state
  [loading]="loading()"
  [error]="error()"
  [empty]="users().length === 0"
  emptyTitle="No users yet"
  emptyDescription="Users will appear here after they register."
  (retry)="retry()"
>
  <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
    <table mat-table [dataSource]="users()">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="groups">
        <th mat-header-cell *matHeaderCellDef>Groups</th>
        <td mat-cell *matCellDef="let row">{{ row.groups.join(', ') }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>

  <app-page-pager
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    [disabled]="loading()"
    (pageChange)="onPageChange($event)"
  />
</app-request-state>
