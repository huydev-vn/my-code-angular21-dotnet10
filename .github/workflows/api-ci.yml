name: API CI

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: api

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api.slnx

      - name: Build
        run: dotnet build api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test api.slnx --configuration Release --no-build --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Development
