name: API CI

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - "docker-compose.yml"

defaults:
  run:
    working-directory: api

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api.slnx

      - name: Build
        run: dotnet build api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test api.slnx --configuration Release --no-build --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=app;Username=postgres;Password=postgres
          Redis__ConnectionString: localhost:6379
          Jwt__SigningKey: DEV-ONLY-CHANGE-ME-USE-USER-SECRETS!!

      - name: Apply migrations (smoke)
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project Infrastructure/Infrastructure.csproj \
            --startup-project api/api.csproj \
            --connection "Host=localhost;Port=5432;Database=app;Username=postgres;Password=postgres"
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=app;Username=postgres;Password=postgres
          Redis__ConnectionString: localhost:6379
          Jwt__SigningKey: DEV-ONLY-CHANGE-ME-USE-USER-SECRETS!!

      - name: Handoff checklist reminder
        run: |
          echo "Deploy order: migrate once -> ensure Redis healthy -> deploy API replicas."
          echo "See docs/auth-development.md for team handoff rules."