# Local development only. Do not use as a production compose file.
# Redis runs in Docker. PostgreSQL is expected from the host (Windows) on localhost:5432.
# Ports bind to localhost so Redis is not exposed on the LAN.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
